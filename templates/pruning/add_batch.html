{% extends 'base.html' %}
{% block title %}Log Pruning Batch{% endblock %}
{% block page_title %}Log Pruning Batch{% endblock %}
{% block content %}
<div class="page-header"><h2>Log Pruning Batch</h2><p>Trees are pruned in batches. The system tracks progress toward completing the full farm cycle.</p></div>
<div class="card" style="max-width:700px;">
<form method="POST">
  <input type="hidden" name="activity_id" value="{{ activity_id }}">
  <div class="form-grid">
    <div class="form-group"><label>Farm</label>
      <select name="farm_id" required>
        {% for f in farms %}<option value="{{ f['id'] }}" {% if f['id']|string==farm_id %}selected{% endif %}>{{ f['name'] }}</option>{% endfor %}
      </select></div>
    <div class="form-group"><label>Date</label><input type="date" name="date" required></div>
    <div class="form-group"><label>Trees Pruned (this batch)</label><input type="number" name="trees_pruned" min="1" required></div>
    <div class="form-group"><label>Number of Labourers</label><input type="number" name="num_labourers" min="0"></div>
    <div class="form-group"><label>Cost (GHS)</label><input type="number" step="0.01" name="cost" min="0"></div>
    <div class="form-group full"><label>Notes</label><textarea name="notes"></textarea></div>
  </div>
  <div class="flex gap-2 mt-2">
    <button type="submit" class="btn btn-primary">Save Batch</button>
    <a href="{{ url_for('pruning.index') }}" class="btn btn-outline">Cancel</a>
  </div>
</form>
</div>
{% endblock %}
