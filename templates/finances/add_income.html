{% extends 'base.html' %}
{% block title %}Record Income{% endblock %}
{% block page_title %}Record Farm Income{% endblock %}
{% block content %}
<div class="card" style="max-width:700px;">
<form method="POST">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="form-grid">
    <div class="form-group"><label>Farm</label>
      <select name="farm_id" required>{% for f in farms %}<option value="{{ f['id'] }}">{{ f['name'] }}</option>{% endfor %}</select></div>
    <div class="form-group"><label>Date</label><input type="date" name="date" required></div>
    <div class="form-group"><label>Income Type</label>
      <select name="income_type"><option>FFB Sale</option><option>Other</option></select></div>
    <div class="form-group"><label>Buyer</label><input name="buyer"></div>
    <div class="form-group"><label>Quantity (bunches)</label><input type="number" step="0.01" name="quantity"></div>
    <div class="form-group"><label>Unit Price (GHS)</label><input type="number" step="0.01" name="unit_price"></div>
    <div class="form-group full"><label>Notes</label><textarea name="notes"></textarea></div>
  </div>
  <div class="flex gap-2 mt-2">
    <button type="submit" class="btn btn-primary">Save Income</button>
    <a href="{{ url_for('finances.income') }}" class="btn btn-outline">Cancel</a>
  </div>
</form>
</div>
{% endblock %}
