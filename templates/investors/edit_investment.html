{% extends 'base.html' %}
{% block title %}Edit Investment{% endblock %}
{% block page_title %}Investors{% endblock %}
{% block content %}
<div class="breadcrumb">
  <a href="{{ url_for('investors.index') }}">Investors</a>
  <span class="breadcrumb-sep">›</span>
  <a href="{{ url_for('investors.detail', investor_id=inv['investor_id']) }}">{{ inv['investor_name'] }}</a>
  <span class="breadcrumb-sep">›</span>
  <span>Edit Investment</span>
</div>
<div class="page-header">
  <div><h2>Edit Investment</h2><p>{{ inv['investor_name'] }}</p></div>
</div>
<div class="card" style="max-width:780px;">
  <form method="POST">
    <div class="form-grid">
      <div class="form-group">
        <label>Date</label>
        <input type="date" name="date" value="{{ inv['date'] }}" required>
      </div>
      <div class="form-group">
        <label>Amount (GHS)</label>
        <input type="number" step="0.01" name="amount" value="{{ inv['amount'] }}" required>
      </div>
      <div class="form-group">
        <label>Investment Type</label>
        <select name="investment_type">
          {% for t in investment_types %}
          <option {% if t == inv['investment_type'] %}selected{% endif %}>{{ t }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label>Farm</label>
        <select name="farm_id">
          <option value="">All Farms / General</option>
          {% for f in farms %}
          <option value="{{ f['id'] }}" {% if f['id'] == inv['farm_id'] %}selected{% endif %}>{{ f['name'] }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label>Equity %</label>
        <input type="number" step="0.1" name="equity_pct" value="{{ inv['equity_pct'] or '' }}">
      </div>
      <div class="form-group">
        <label>Expected Return (GHS)</label>
        <input type="number" step="0.01" name="expected_return" value="{{ inv['expected_return'] or '' }}">
      </div>
      <div class="form-group">
        <label>Expected Return Date</label>
        <input type="date" name="return_date" value="{{ inv['return_date'] or '' }}">
      </div>
      <div class="form-group">
        <label>Status</label>
        <select name="status">
          {% for s in statuses %}
          <option {% if s == inv['status'] %}selected{% endif %}>{{ s }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group full">
        <label>Notes</label>
        <input name="notes" value="{{ inv['notes'] or '' }}">
      </div>
    </div>
    <div class="flex gap-2 mt-2">
      <button type="submit" class="btn btn-primary">💾 Update Investment</button>
      <a href="{{ url_for('investors.detail', investor_id=inv['investor_id']) }}" class="btn btn-outline">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
