{% extends 'base.html' %}
{% block title %}Add Investor{% endblock %}
{% block page_title %}Investors{% endblock %}
{% block content %}
<div class="page-header">
  <div><h2>Add Investor</h2><p>Record a new investor's details.</p></div>
</div>
<div class="card" style="max-width:680px;">
  <form method="POST">
    <div class="form-grid">
      <div class="form-group">
        <label>Full Name *</label>
        <input name="name" required placeholder="e.g. Kofi Mensah">
      </div>
      <div class="form-group">
        <label>Date Joined</label>
        <input type="date" name="date_joined" value="{{ today }}">
      </div>
      <div class="form-group">
        <label>Phone</label>
        <input name="phone" placeholder="e.g. 0244 000 000">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" placeholder="e.g. kofi@email.com">
      </div>
      <div class="form-group full">
        <label>Location</label>
        <input name="location" placeholder="e.g. Sunyani, Bono Region">
      </div>
      <div class="form-group full">
        <label>Notes</label>
        <textarea name="notes" placeholder="Any additional notes about this investor..."></textarea>
      </div>
    </div>
    <div class="flex gap-2 mt-2">
      <button type="submit" class="btn btn-primary">💾 Save Investor</button>
      <a href="{{ url_for('investors.index') }}" class="btn btn-outline">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
