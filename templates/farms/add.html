{% extends 'base.html' %}
{% block title %}Add Farm{% endblock %}
{% block page_title %}Add Farm{% endblock %}
{% block content %}
<div class="page-header"><h2>Add New Farm</h2></div>
<div class="card" style="max-width:700px;">
<form method="POST">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="form-grid">
    <div class="form-group"><label>Farm Name</label><input name="name" required></div>
    <div class="form-group"><label>Location</label><input name="location"></div>
    <div class="form-group"><label>Constituency</label><input name="constituency"></div>
    <div class="form-group"><label>Size (Acres)</label><input name="size_acres" type="number" step="0.1"></div>
    <div class="form-group"><label>Crop Type</label>
      <select name="crop_type"><option>Oil Palm</option><option>Cashew</option></select></div>
    <div class="form-group"><label>Status</label>
      <select name="status"><option>Active</option><option>Inactive</option><option>Development</option></select></div>
    <div class="form-group"><label>Total Trees (Oil Palm)</label><input name="total_trees" type="number" placeholder="0"></div>
    <div class="form-group full"><label>Notes</label><textarea name="notes"></textarea></div>
  </div>
  <div class="flex gap-2 mt-2">
    <button type="submit" class="btn btn-primary">Save Farm</button>
    <a href="{{ url_for('farms.index') }}" class="btn btn-outline">Cancel</a>
  </div>
</form>
</div>
{% endblock %}
