{% extends 'base.html' %}
{% block title %}Edit {{ farm['name'] }}{% endblock %}
{% block page_title %}Edit Farm{% endblock %}
{% block content %}
<div class="page-header"><h2>Edit — {{ farm['name'] }}</h2></div>
<div class="card" style="max-width:700px;">
<form method="POST">
  <div class="form-grid">
    <div class="form-group"><label>Farm Name</label><input name="name" value="{{ farm['name'] }}" required></div>
    <div class="form-group"><label>Location</label><input name="location" value="{{ farm['location'] }}"></div>
    <div class="form-group"><label>Constituency</label><input name="constituency" value="{{ farm['constituency'] }}"></div>
    <div class="form-group"><label>Size (Acres)</label><input name="size_acres" type="number" step="0.1" value="{{ farm['size_acres'] }}"></div>
    <div class="form-group"><label>Crop Type</label>
      <select name="crop_type">
        <option {% if farm['crop_type']=='Oil Palm' %}selected{% endif %}>Oil Palm</option>
        <option {% if farm['crop_type']=='Cashew' %}selected{% endif %}>Cashew</option>
      </select></div>
    <div class="form-group"><label>Status</label>
      <select name="status">
        <option {% if farm['status']=='Active' %}selected{% endif %}>Active</option>
        <option {% if farm['status']=='Inactive' %}selected{% endif %}>Inactive</option>
        <option {% if farm['status']=='Development' %}selected{% endif %}>Development</option>
      </select></div>
    <div class="form-group"><label>Total Trees</label><input name="total_trees" type="number" value="{{ farm['total_trees'] }}"></div>
    <div class="form-group full"><label>Notes</label><textarea name="notes">{{ farm['notes'] }}</textarea></div>
  </div>
  <div class="flex gap-2 mt-2">
    <button type="submit" class="btn btn-primary">Update Farm</button>
    <a href="{{ url_for('farms.detail', farm_id=farm['id']) }}" class="btn btn-outline">Cancel</a>
  </div>
</form>
</div>
{% endblock %}
