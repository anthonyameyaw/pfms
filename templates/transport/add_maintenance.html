{% extends 'base.html' %}
{% block title %}Pickup Maintenance{% endblock %}
{% block page_title %}Log Pickup Maintenance{% endblock %}
{% block content %}
<div class="card" style="max-width:600px;">
<form method="POST">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="form-grid">
    <div class="form-group"><label>Date</label><input type="date" name="date" required></div>
    <div class="form-group"><label>Cost (GHS)</label><input type="number" step="0.01" name="cost" required></div>
    <div class="form-group full"><label>Description of Work Done</label><textarea name="description" required></textarea></div>
    <div class="form-group full"><label>Notes</label><textarea name="notes"></textarea></div>
  </div>
  <div class="flex gap-2 mt-2">
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="{{ url_for('transport.index') }}" class="btn btn-outline">Cancel</a>
  </div>
</form>
</div>
{% endblock %}
