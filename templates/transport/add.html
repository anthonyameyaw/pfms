{% extends 'base.html' %}
{% block title %}Log Trip{% endblock %}
{% block page_title %}Log Transport Trip{% endblock %}
{% block content %}
<div class="card" style="max-width:650px;">
<form method="POST" id="tForm">
  <div class="form-grid">
    <div class="form-group"><label>Date</label><input type="date" name="date" required></div>
    <div class="form-group"><label>Transport Type</label>
      <select name="transport_type" id="ttype" onchange="toggleFields()">
        <option>Pickup</option><option>Tricycle</option>
      </select></div>
    <div class="form-group"><label>Farm Served</label>
      <select name="farm_id"><option value="">Select farm...</option>
        {% for f in farms %}<option value="{{ f['id'] }}">{{ f['name'] }}</option>{% endfor %}
      </select></div>
    <div class="form-group" id="fuel_group"><label>Fuel Cost (GHS)</label><input type="number" step="0.01" name="fuel_cost" value="0"></div>
    <div class="form-group" id="driver_group"><label>Driver Pay (GHS)</label><input type="number" step="0.01" name="driver_pay" value="0"></div>
    <div class="form-group" id="rental_group" style="display:none;"><label>Rental Fee (GHS)</label><input type="number" step="0.01" name="rental_cost" value="0"></div>
    <div class="form-group full"><label>Notes</label><textarea name="notes"></textarea></div>
  </div>
  <div class="flex gap-2 mt-2">
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="{{ url_for('transport.index') }}" class="btn btn-outline">Cancel</a>
  </div>
</form>
</div>
{% endblock %}
{% block extra_js %}
<script>
function toggleFields() {
  const t = document.getElementById('ttype').value;
  document.getElementById('fuel_group').style.display   = t==='Pickup' ? '' : 'none';
  document.getElementById('driver_group').style.display = t==='Pickup' ? '' : 'none';
  document.getElementById('rental_group').style.display = t==='Tricycle' ? '' : 'none';
}
</script>
{% endblock %}
