{% extends 'base.html' %}
{% block title %}Add Farmer{% endblock %}
{% block page_title %}Add Outside Farmer{% endblock %}
{% block content %}
<div class="card" style="max-width:600px;">
<form method="POST">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="form-grid">
    <div class="form-group"><label>Name</label><input name="name" required></div>
    <div class="form-group"><label>Phone</label><input name="phone"></div>
    <div class="form-group full"><label>Location / Area</label><input name="location"></div>
    <div class="form-group full"><label>Notes</label><textarea name="notes"></textarea></div>
  </div>
  <div class="flex gap-2 mt-2">
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="{{ url_for('plant.farmers') }}" class="btn btn-outline">Cancel</a>
  </div>
</form>
</div>
{% endblock %}
